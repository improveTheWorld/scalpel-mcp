# Preset Scalpel : session DSH sans outils fichiers plats.
# Le client MCP vit dans le preset, pas au niveau hôte : ses outils
# n'entrent le contexte que des agents qui sélectionnent ce preset.
- insert:
    - id: preset-scalpel
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: scalpel
        name: Scalpel
        description: Lecture et édition uniquement via le graphe Scalpel. Les outils fichiers plats sont absents.
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                Tu es un agent d'ingénierie. Cette session est un banc d'essai de Scalpel.
                Les outils fichiers plats read, edit, write, grep et glob ne sont pas montés : ce n'est pas une panne.
                Toute lecture, recherche et modification de source passe par les outils mcp__scalpel__*.
                L'adresse d'un bloc est un chemin, ou un chemin suivi de :: et du symbole ou du titre tel qu'il est affiché.
                read_block sur un dossier ou un fichier liste ses enfants ; sur un symbole il rend le texte numéroté et le hash à repasser à edit_block.
                pwsh sert aux commandes, aux tests et aux builds. Il ne sert pas à lire ni à modifier le source (pas de Get-Content, Set-Content, ni de réécriture de fichier par script).
                Quand l'utilisateur demande le bilan de la session, ou quand tu déclares une tâche terminée, écris une section « Bilan Scalpel » : refus reçus, tours de réparation, cas où l'intention était claire et où l'outil a quand même refusé ou imposé une étape inutile, et ce qui a fonctionné du premier coup.
              suffix: Your working directory is {{cwd}}. Scalpel indexe C:\CodeSource\dsh-boost.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: scalpel-mcp
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: scalpel
              transport: stdio
              command: 'C:\Users\bilel\AppData\Local\Microsoft\WindowsApps\PythonSoftwareFoundation.Python.3.13_qbz5n2kfra8p0\python.exe'
              args:
                - '-m'
                - ast_graph_server
                - '--workspace'
                - 'C:\CodeSource\dsh-boost'
              cwd: 'C:\CodeSource\dsh-boost'
              toolCallTimeoutMs: 120000
              failOnStartupError: true
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    Tu es en mode plan. Reste-y jusqu'à ce que exit_plan_mode réussisse ou que l'utilisateur change le mode.
                    Explore avec les outils Scalpel, pas avec un shell de lecture. N'édite rien tant que le plan n'est pas approuvé.
                    Quand le plan est prêt, appelle exit_plan_mode avec le plan complet, et que ce soit le seul appel d'outil de cette réponse.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

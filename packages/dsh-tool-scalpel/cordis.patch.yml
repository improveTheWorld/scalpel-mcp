# Enregistre le plugin d'outils Scalpel et insère le preset scalpel dynamique
- insert:
    - id: tool-scalpel
      name: '@local/dsh-tool-scalpel'

    - id: preset-scalpel
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: scalpel
        name: Scalpel
        description: Lecture et édition universelle via le graphe Scalpel, lié dynamiquement au workspace de la session.
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                Tu es un agent d'ingénierie. Cette session utilise exclusivement le graphe AST Scalpel.
                Les outils fichiers plats read, edit, write, grep et glob sont désactivés : toute manipulation de source passe par les outils Scalpel natifs :
                - read_block : liste les membres d'un fichier ou renvoie le texte numéroté + hash d'un symbole (adresse avec ::).
                - search_symbols, search_documents, get_project_map, build_context : pour découvrir le code.
                - edit_block, insert_block, delete_block : pour modifier le code avec sécurité de hash.
                pwsh sert uniquement aux commandes système et tests, pas à lire/écrire les fichiers sources.
                En fin de tâche ou sur demande de bilan, produis une section « Bilan Scalpel » détaillant les blocages, refus inattendus et réussites.
              suffix: Your working directory is {{cwd}}. Scalpel opère dynamiquement sur ce workspace.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-scalpel
            name: '@local/dsh-tool-scalpel'
            config:
              unindexedFallback: ask
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    Tu es en mode plan. Explore le projet avec les outils Scalpel (search_symbols, read_block).
                    N'édite rien tant que le plan n'est pas validé.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

    - id: preset-cordis-scalpel
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cordis-scalpel
        name: Creator Scalpel
        description: >-
          Développement et extension de plugins Cordis et presets DSH, avec lecture et édition universelle via le graphe AST Scalpel au lieu des fichiers plats.
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                Tu es un agent spécialisé dans le développement et l'extension de plugins Cordis et de presets DeepSeek Harness, propulsé par le modèle {{model}}.
                Cette session utilise exclusivement le graphe AST Scalpel au lieu des fichiers plats.
                Les outils fichiers plats read, edit, write, grep et glob sont désactivés : toute manipulation de source passe par les outils Scalpel natifs :
                - read_block : inspecter les membres d'un fichier ou obtenir le texte numéroté et le hash d'un symbole (adresse avec ::).
                - search_symbols, search_documents, get_project_map, build_context : pour découvrir le code.
                - edit_block, insert_block, delete_block : pour modifier le code avec sécurité de hash.
                pwsh sert uniquement aux commandes système et tests, pas à lire/écrire les fichiers sources.
                En fin de tâche ou sur demande de bilan, produis une section « Bilan Scalpel » détaillant les blocages, refus inattendus et réussites.
              suffix: Your working directory is {{cwd}}. Scalpel opère dynamiquement sur ce workspace.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-scalpel
            name: '@local/dsh-tool-scalpel'
            config:
              unindexedFallback: ask
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    Tu es en mode plan. Explore le projet avec les outils Scalpel (search_symbols, read_block).
                    N'édite rien tant que le plan n'est pas validé.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.env.APPDATA, 'npm/node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-agent-preset/skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"

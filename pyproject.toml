[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-graph-server"
version = "0.4.6"
description = "AST Code-Graph MCP Server for LLM Agentic Coding"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Scalpel Team" }
]
dependencies = [
    "mcp>=2.2.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-c-sharp>=0.23.0",
    "pypdf>=4.0.0",
    "olefile>=0.47",
    "watchdog>=6.0.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
ast-graph-server = "ast_graph_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
